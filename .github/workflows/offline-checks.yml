name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Temporary migration oracle; remove after Python batch 8.
  py-cs-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ratchet fingerprints, baseline bytes, guidance fix and TIA capture
        run: dotnet run scripts/checks/Test-StaticCheckParity.cs -- -Python python -Output bin-build/py-cs-parity
      - name: Product generators produce the committed bytes
        run: |
          dotnet run --project build-tools/release -- generate-catalogs -Check
          dotnet run --project build-tools/release -- generate-tool-usage -Check
          dotnet run --project build-tools/release -- generate-release-migration -Check
          dotnet run --project build-tools/release -- generate-tool-counts -Check
          dotnet run --project build-tools/release -- check-tools-list
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: py-cs-parity-${{ matrix.os }}
          path: bin-build/py-cs-parity
      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  offline-tests:
    # 已迁移的 xunit 套件逐项生成 trx；最低数量门禁拒绝零测试、失败和超限跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: TRX gate self-checks
        run: dotnet run --project build-tools/release -- test-suites -SelfTest
      - name: Offline regression, generation basic package and MCP SDK version policy
        run: dotnet run --project build-tools/release -- test-suites -Shards 4 -MaxParallelism 4 -Suite offline -Suite offline-v20 -Suite kept-code -Suite kept-code-v20 -Suite version-policy -Suite generation-model -Suite generation-planning -Suite workbench-control-protocol
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: offline-test-results
          path: |
            bin-build/test-results*/
            bin-build/check-all/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  source-contracts:
    # Source contracts: .NET 10 and Python, without Siemens SDKs or TIA.
    # Keep the inventory in docs/development/validation.md in sync with these steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Official example catalog must match pinned sources
        run: |
          dotnet run --project build-tools/release -- generate-catalogs -Check
          dotnet run --project build-tools/release -- generate-tool-usage -Check
          dotnet run --project build-tools/release -- generate-release-migration -Check
          dotnet run --project build-tools/release -- generate-tool-counts -Check
      - name: Write guard roster and operation categories
        run: |
          dotnet run --project build-tools/release -- check-tools-list -SelfTest
          dotnet run --project build-tools/release -- check-tools-list
      - name: Script calls must use registered V4 tools
        run: |
          python scripts/checks/Check-ScriptToolCalls.py --self-test
          python scripts/checks/Check-ScriptToolCalls.py
          python scripts/checks/Test-CampaignInputs.py --self-test
          dotnet run --project build-tools/release -- check-script-tool-calls
      - name: Descriptions must not name unregistered tools
        run: dotnet run --project build-tools/release -- check-dead-tool-references
      - name: Repository, layout, exception, comment, MCP text and response-envelope contracts
        run: dotnet run --project build-tools/release -- check-repository -NoBinaries
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: Production source contracts and Python compatibility vectors
        run: dotnet run --project build-tools/release -- test-suites -Suite source-contracts
      - name: Native adapter host and JSON dependency boundary
        run: |
          dotnet run --project build-tools/release -- check-adapter-boundary
      - name: Domain fixture source coverage
        run: python3 scripts/checks/Test-DomainTools.py --source-only
      - name: Static V4 contract inventories and response coverage
        run: |
          python3 scripts/checks/Snapshot-ToolContracts.py self-test
          python3 scripts/checks/Snapshot-ToolContracts.py verify
          python3 scripts/checks/Snapshot-ToolResponses.py verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: source-contract-test-results
          path: |
            bin-build/test-results*/
            bin-build/check-all/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  studio-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        shared-adapter-paths: ['false', 'true']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build src/Studio/Gui/TiaOpenness.Gui.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}
      - name: Studio client functional tests
        run: dotnet test tests/Studio/TiaOpenness.Core.Tests/TiaOpenness.Core.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }} --logger "trx;LogFileName=studio-core.trx" --results-directory bin-build/ci-test-results/studio-core
      - name: Studio WPF functional tests
        run: dotnet test tests/Studio/TiaOpenness.Gui.Tests/TiaOpenness.Gui.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }} --logger "trx;LogFileName=studio-gui.trx" --results-directory bin-build/ci-test-results/studio-gui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-test-results-${{ matrix.shared-adapter-paths }}
          path: bin-build/ci-test-results/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  foundation-suites:
    # One 4-vCPU runner cannot host this group at 4-way parallelism without starving its own
    # timing-sensitive tests. Four runners each run a disjoint quarter of the shards at 2-way
    # parallelism; foundation-suites-gate applies every registered suite gate to their union.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the development host that the host CLI tests start
        run: dotnet build src/FoundationHost/TiaMcp.FoundationHost.csproj -c Release
      - name: Foundation contracts and functional tests, runner ${{ matrix.runner }} of 4
        run: dotnet run --project build-tools/release -- test-suites -Shards 8 -MaxParallelism 2 -RunnerIndex ${{ matrix.runner }} -RunnerCount 4 -ResultsDirectory bin-build/runner-results -Suite foundation -Suite engine-host -Suite shared-session -Suite shared-lifecycle -Suite worker-progress -Suite prompt-registration -Suite software-read -Suite special-export-shape -Suite device-add -Suite hardware-catalog -Suite diagnostic-membership -Suite adapter-contracts -Suite worker-channel -Suite compile-candidate -Suite compile-candidate-no-safety -Suite fallback-vci-modern -Suite fallback-vci-initial -Suite fallback-vci-classic -Suite workbench-control-protocol
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-runner-${{ matrix.runner }}
          path: bin-build/runner-results/

  foundation-suites-gate:
    # Same -Shards and suite list as the runners: the gate recomputes the shard plan and refuses a
    # missing runner, a shard that no runner or two runners ran, and any suite gate failure.
    needs: foundation-suites
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v6
        with:
          pattern: foundation-runner-*
          path: bin-build/runner-results
      - name: Registered suite gates over every runner's shards
        run: dotnet run --project build-tools/release -- test-suites -Shards 8 -GateOnly -RunnerResults bin-build/runner-results -ResultsDirectory bin-build/test-results-fast -Suite foundation -Suite engine-host -Suite shared-session -Suite shared-lifecycle -Suite worker-progress -Suite prompt-registration -Suite software-read -Suite special-export-shape -Suite device-add -Suite hardware-catalog -Suite diagnostic-membership -Suite adapter-contracts -Suite worker-channel -Suite compile-candidate -Suite compile-candidate-no-safety -Suite fallback-vci-modern -Suite fallback-vci-initial -Suite fallback-vci-classic -Suite workbench-control-protocol
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-transport-test-results
          path: |
            bin-build/test-results*/

  foundation-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build host and synthetic worker without Siemens SDKs
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/FoundationHost/TiaMcp.FoundationHost.csproj -c Release -o bin-build/ci-foundation
          dotnet build tests/WorkerChannel/TiaMcp.WorkerChannel.TransportFixture/TiaMcp.WorkerChannel.TransportFixture.csproj -c Release
          for key in 14sp1 15.1 16 17 18 19; do
            target="runtime/v$key"
            mkdir -p "$target"
            cp bin-build/ci-foundation/* "$target/"
            printf '%s' "$key" > "$target/release-key.txt"
          done
      - name: Six real STDIO hosts and isolated HTTP sessions
        run: python scripts/checks/Test-FoundationTransport.py --fixture tests/WorkerChannel/TiaMcp.WorkerChannel.TransportFixture/bin/Release/net10.0/TiaMcp.WorkerChannel.TransportFixture.exe --releases 14sp1 15.1 16 17 18 19 --output bin-build/ci-foundation-results
      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-transport-host-results
          path: |
            bin-build/check-all/
            bin-build/ci-foundation-results/
