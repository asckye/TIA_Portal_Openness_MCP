name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    # 已迁移的 xunit 套件逐项生成 trx；最低数量门禁拒绝零测试、失败和超限跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: TRX gate self-checks
        run: dotnet run --project build-tools/release -- test-suites -SelfTest
      - name: Offline regression, generation basic package and MCP SDK version policy
        run: dotnet run --project build-tools/release -- test-suites -Shards 4 -MaxParallelism 4 -Suite kept-code -Suite version-policy -Suite generation-model -Suite generation-planning -Suite workbench-control-protocol
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: offline-test-results
          path: |
            bin-build/test-results*/
            bin-build/check-all/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  source-contracts:
    # Source contracts: .NET 10 and Python, without Siemens SDKs or TIA.
    # Keep the inventory in docs/manuals/validation.md in sync with these steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Official example catalog must match pinned sources
        run: |
          dotnet run --project build-tools/release -- generate-catalogs -Check
          dotnet run --project build-tools/release -- generate-tool-usage -Check
          dotnet run --project build-tools/release -- generate-release-migration -Check
          dotnet run --project build-tools/release -- generate-tool-counts -Check
      - name: Write guard roster and operation categories
        run: |
          dotnet run --project build-tools/release -- check-tools-list -SelfTest
          dotnet run --project build-tools/release -- check-tools-list
      - name: Script calls must use registered V4 tools
        run: |
          python scripts/checks/Test-CampaignInputs.py --self-test
          dotnet run --project build-tools/release -- check-script-tool-calls
      - name: Descriptions must not name unregistered tools
        run: dotnet run --project build-tools/release -- check-dead-tool-references
      - name: Repository, layout, exception, comment, MCP text and response-envelope contracts
        run: dotnet run --project build-tools/release -- check-repository -NoBinaries
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: Production source contracts and Python compatibility vectors
        run: dotnet run --project build-tools/release -- test-suites -Suite source-contracts
      - name: Native adapter host and JSON dependency boundary
        run: |
          dotnet run --project build-tools/release -- check-adapter-boundary
      - name: Static V4 contract inventories
        run: |
          python3 scripts/checks/Snapshot-ToolContracts.py self-test
          python3 scripts/checks/Snapshot-ToolContracts.py verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: source-contract-test-results
          path: |
            bin-build/test-results*/
            bin-build/check-all/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  studio-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build src/Studio/Gui/TiaOpenness.Gui.csproj -c Release --nologo -p:TiaSharedAdapterPaths=false
      - name: Studio client functional tests
        run: dotnet run --project build-tools/release -- test-suites -Suite studio-core -Shards 1 -ResultsDirectory bin-build/ci-test-results
      - name: Studio WPF functional tests
        run: dotnet run --project build-tools/release -- test-suites -Suite studio-gui -Shards 1 -ResultsDirectory bin-build/ci-test-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-test-results
          path: bin-build/ci-test-results/

      - name: Compile every file-based C# program
        run: dotnet run --project build-tools/release -- build-file-programs
      - name: Reviewed analyzer warning ratchet
        run: dotnet run --project build-tools/release -- check-analyzer-warnings -Check

  foundation-suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the development host that the host CLI tests start
        run: dotnet build src/FoundationHost/TiaMcp.FoundationHost.csproj -c Release
      - name: Foundation contracts and functional tests
        run: dotnet run --project build-tools/release -- test-suites -Shards 8 -MaxParallelism 2 -ResultsDirectory bin-build/runner-results -Suite foundation -Suite engine-host -Suite shared-lifecycle-plc -Suite worker-progress-foundation -Suite prompt-registration -Suite software-read -Suite special-export-shape -Suite device-add -Suite hardware-catalog -Suite diagnostic-membership -Suite adapter-contracts -Suite worker-channel -Suite workbench-control-protocol
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-test-results
          path: bin-build/runner-results/
