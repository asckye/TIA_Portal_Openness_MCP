name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Temporary migration oracle; remove after Python batch 8.
  py-cs-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ratchet fingerprints, baseline bytes, guidance fix and TIA capture
        run: dotnet run scripts/checks/Test-StaticCheckParity.cs -- -Python python -Output bin-build/py-cs-parity
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: py-cs-parity-${{ matrix.os }}
          path: bin-build/py-cs-parity
  offline-tests:
    # 已迁移的 xunit 套件逐项生成 trx；最低数量门禁拒绝零测试、失败和超限跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: TRX gate self-checks
        run: dotnet run --project build-tools/release -- test-suites -SelfTest
      - name: Offline regression, generation basic package and MCP SDK version policy
        run: dotnet run --project build-tools/release -- test-suites -Suite offline -Suite offline-v20 -Suite version-policy -Suite generation-model -Suite generation-planning -Suite workbench-control-protocol

  source-contracts:
    # Source contracts: .NET 10 and Python, without Siemens SDKs or TIA.
    # Keep the inventory in docs/development/validation.md in sync with these steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Official example catalog must match pinned sources
        run: python3 scripts/generate/Generate-ToolUsage.py --check
      - name: Write guard roster and operation categories
        run: |
          python3 scripts/checks/Check-ToolsList.py --self-test
          python3 scripts/checks/Check-ToolsList.py
      - name: Script calls must use registered V4 tools
        run: |
          python scripts/checks/Check-ScriptToolCalls.py --self-test
          python scripts/checks/Check-ScriptToolCalls.py
          dotnet run --project build-tools/release -- check-script-tool-calls
      - name: Descriptions must not name unregistered tools
        run: dotnet run --project build-tools/release -- check-dead-tool-references
      - name: Repository, layout, exception, comment, MCP text and response-envelope contracts
        run: dotnet run --project build-tools/release -- check-repository -NoBinaries
      - name: Static checker self-tests
        run: dotnet run --project build-tools/release -- check-repository -SelfTest
      - name: Production source contracts and Python compatibility vectors
        run: dotnet run --project build-tools/release -- test-suites -Suite source-contracts
      - name: Native adapter host and JSON dependency boundary
        run: |
          dotnet run --project build-tools/release -- check-adapter-boundary
      - name: Domain fixture source coverage
        run: python3 scripts/checks/Test-DomainTools.py --source-only
      - name: Static V4 contract inventories and response coverage
        run: |
          python3 scripts/checks/Snapshot-ToolContracts.py verify
          python3 scripts/checks/Snapshot-ToolResponses.py verify

  studio-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        shared-adapter-paths: ['false', 'true']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build src/Studio/Gui/TiaOpenness.Gui.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}
      - name: Studio client functional tests
        run: dotnet test tests/Studio/TiaOpenness.Core.Tests/TiaOpenness.Core.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}
      - name: Studio WPF functional tests
        run: dotnet test tests/Studio/TiaOpenness.Gui.Tests/TiaOpenness.Gui.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}

  foundation-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Foundation contracts and functional tests
        run: dotnet run --project build-tools/release -- test-suites -Suite foundation -Suite prompt-registration -Suite software-read -Suite special-export-shape -Suite device-add -Suite hardware-catalog -Suite diagnostic-membership -Suite adapter-contracts -Suite worker-channel -Suite compile-candidate -Suite compile-candidate-no-safety -Suite fallback-vci-modern -Suite fallback-vci-initial -Suite fallback-vci-classic -Suite workbench-control-protocol
      - name: Build host and synthetic worker without Siemens SDKs
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/FoundationHost/TiaMcp.FoundationHost.csproj -c Release -o bin-build/ci-foundation
          dotnet build tests/WorkerChannel/TiaMcp.WorkerChannel.TransportFixture/TiaMcp.WorkerChannel.TransportFixture.csproj -c Release
          for key in 14sp1 15.1 16 17 18 19; do
            target="runtime/v$key"
            mkdir -p "$target"
            cp bin-build/ci-foundation/* "$target/"
            printf '%s' "$key" > "$target/release-key.txt"
          done
      - name: Six real STDIO hosts and isolated HTTP sessions
        run: python scripts/checks/Test-FoundationTransport.py --fixture tests/WorkerChannel/TiaMcp.WorkerChannel.TransportFixture/bin/Release/net10.0/TiaMcp.WorkerChannel.TransportFixture.exe --releases 14sp1 15.1 16 17 18 19 --output bin-build/ci-foundation-results
