name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    # 已迁移的 xunit 套件逐项生成 trx；最低数量门禁拒绝零测试、失败和超限跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Swallowed-exception checker self-tests
        run: python scripts/checks/Check-SwallowedExceptions.py --self-test
      - name: TRX gate self-checks
        run: python scripts/checks/Test-DotnetSuites.py --self-test
      - name: Offline regression and MCP SDK version policy
        run: python scripts/checks/Test-DotnetSuites.py --suite offline --suite offline-v20 --suite version-policy

  dead-tool-references:
    # 工具描述里点名的工具必须真的注册过。踩过的形状：某个能力被刻意下线了，
    # 但两条描述还写着 "use <那个工具>" —— AI 客户端照做只会撞 tool-not-found，
    # 然后自己去找别的路子绕。纯源码对拍，不需要装 TIA。
    # 脚本自带必错哨兵：闸门本身坏了会报 FAIL，而不是假 PASS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Official example catalog must match pinned sources
        run: python3 scripts/generate/Generate-ToolUsage.py --check
      - name: Descriptions must not name unregistered tools
        run: python3 scripts/checks/Check-DeadToolReferences.py

  studio-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build tools/tia-openness-studio/src/TiaOpenness.Gui/TiaOpenness.Gui.csproj -c Release --nologo
      - name: Studio client functional tests
        run: dotnet test tools/tia-openness-studio/tests/TiaOpenness.Core.Tests/TiaOpenness.Core.Tests.csproj -c Release --nologo
      - name: Studio WPF functional tests
        run: dotnet test tools/tia-openness-studio/tests/TiaOpenness.Gui.Tests/TiaOpenness.Gui.Tests.csproj -c Release --nologo

  foundation-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Foundation contracts and functional tests
        run: python scripts/checks/Test-DotnetSuites.py --suite foundation --suite prompt-registration --suite software-read --suite special-export-shape --suite device-add --suite hardware-catalog --suite diagnostic-membership --suite adapter-contracts --suite worker-channel
      - name: Build host and synthetic worker without Siemens SDKs
        shell: pwsh
        run: |
          dotnet publish tools/tiaportal-mcp/src/TiaMcpServer.LegacyHost/TiaMcpServer.LegacyHost.csproj -c Release -o bin-build/ci-foundation
          if ($LASTEXITCODE) { throw 'Host build failed' }
          dotnet build tools/tiaportal-mcp/tests/TiaMcpServer.TransportFixture/TransportFixture.csproj -c Release
          if ($LASTEXITCODE) { throw 'Fixture build failed' }
          foreach ($key in @('14sp1','15.1','16','17','18','19')) {
            $target = "runtime/v$key"
            New-Item -ItemType Directory -Force $target | Out-Null
            Get-ChildItem bin-build/ci-foundation -File | Copy-Item -Destination $target
            [IO.File]::WriteAllText((Join-Path $target 'release-key.txt'), $key)
          }
      - name: Six real STDIO hosts and isolated HTTP sessions
        run: python scripts/checks/Test-FoundationTransport.py --fixture tools/tiaportal-mcp/tests/TiaMcpServer.TransportFixture/bin/Release/net8.0/TransportFixture.exe --output bin-build/ci-foundation-results
