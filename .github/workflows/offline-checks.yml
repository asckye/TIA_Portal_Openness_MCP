name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    # 回归套件是**控制台 Exe**，不是 VSTest 工程：
    # `dotnet test` 在它上面只会还原、一个用例都不跑、然后退 0 ——
    # 一个和「全部通过」长得一模一样的假绿灯。所以这里写死 `dotnet run`。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Offline regression suite
        run: dotnet run --project tools/tiaportal-mcp/tests/TiaMcpServer.Tests/TiaMcpServer.Tests.csproj -c Release --nologo

  dead-tool-references:
    # 工具描述里点名的工具必须真的注册过。踩过的形状：某个能力被刻意下线了，
    # 但两条描述还写着 "use <那个工具>" —— AI 客户端照做只会撞 tool-not-found，
    # 然后自己去找别的路子绕。纯源码对拍，不需要装 TIA。
    # 脚本自带必错哨兵：闸门本身坏了会报 FAIL，而不是假 PASS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Descriptions must not name unregistered tools
        run: python3 scripts/checks/Check-DeadToolReferences.py

  studio-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build tools/tia-openness-studio/src/TiaOpenness.Gui/TiaOpenness.Gui.csproj -c Release --nologo
      - name: Studio client functional tests
        run: dotnet test tools/tia-openness-studio/tests/TiaOpenness.Core.Tests/TiaOpenness.Core.Tests.csproj -c Release --nologo
      - name: Studio WPF functional tests
        run: dotnet test tools/tia-openness-studio/tests/TiaOpenness.Gui.Tests/TiaOpenness.Gui.Tests.csproj -c Release --nologo
