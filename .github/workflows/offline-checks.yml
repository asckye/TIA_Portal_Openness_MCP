name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管 runner 无法编译完整引擎；这里运行离线回归、文案检查，
# 以及不依赖 Siemens DLL 的 Studio 客户端构建和 WPF 功能测试。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    # 已迁移的 xunit 套件逐项生成 trx；最低数量门禁拒绝零测试、失败和超限跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Swallowed-exception checker self-tests
        run: python scripts/checks/Check-SwallowedExceptions.py --self-test
      - name: TRX gate self-checks
        run: python scripts/checks/Test-DotnetSuites.py --self-test
      - name: Offline regression and MCP SDK version policy
        run: python scripts/checks/Test-DotnetSuites.py --suite offline --suite offline-v20 --suite version-policy

  source-contracts:
    # Python-only source contracts: no build, Siemens SDK, TIA or engine process.
    # Keep the inventory in docs/development/validation.md in sync with these steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Official example catalog must match pinned sources
        run: python3 scripts/generate/Generate-ToolUsage.py --check
      - name: Write guard roster and operation categories
        run: |
          python3 scripts/checks/Check-ToolsList.py --self-test
          python3 scripts/checks/Check-ToolsList.py
      - name: Descriptions must not name unregistered tools
        run: python3 scripts/checks/Check-DeadToolReferences.py
      - name: Repository, layout, exception, comment, MCP text and response-envelope contracts
        run: python3 scripts/checks/Check-Repository.py --no-binaries
      - name: Static checker self-tests
        run: |
          python3 scripts/checks/Check-BundleLayout.py --self-test
          python3 scripts/checks/Check-CommentHygiene.py --self-test
          python3 scripts/checks/Check-McpText.py --self-test
          python3 scripts/checks/Inventory-ResponseEnvelopes.py --self-test
          python3 scripts/checks/Check-EnvelopeRewrite.py --self-test
          python3 scripts/checks/Check-Repository.py --self-test
          python3 scripts/checks/Test-EngineSources.py
      - name: Diagnostic membership contracts
        run: python3 scripts/checks/Test-DiagnosticMembershipSources.py
      - name: Native adapter host and JSON dependency boundary
        run: |
          python3 scripts/checks/Check-AdapterBoundary.py --self-test
          python3 scripts/checks/Check-AdapterBoundary.py
      - name: Document import safety contracts
        run: python3 scripts/checks/Test-DocumentImportSafetySources.py
      - name: Import selection contracts
        run: python3 scripts/checks/Test-ImportSelectionSources.py
      - name: Prompt registration contracts
        run: python3 scripts/checks/Test-PromptRegistrationSources.py
      - name: Version catalog wiring contracts
        run: python3 scripts/checks/Test-VersionCatalogWiring.py
      - name: Domain fixture source coverage
        run: python3 scripts/checks/Test-DomainTools.py --source-only
      - name: Static V4 contract inventories and response coverage
        run: |
          python3 scripts/checks/Snapshot-ToolContracts.py verify
          python3 scripts/checks/Snapshot-ToolResponses.py verify

  studio-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        shared-adapter-paths: ['false', 'true']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio
        run: dotnet build src/Studio/Gui/TiaOpenness.Gui.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}
      - name: Studio client functional tests
        run: dotnet test tests/Studio/TiaOpenness.Core.Tests/TiaOpenness.Core.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}
      - name: Studio WPF functional tests
        run: dotnet test tests/Studio/TiaOpenness.Gui.Tests/TiaOpenness.Gui.Tests.csproj -c Release --nologo -p:TiaSharedAdapterPaths=${{ matrix.shared-adapter-paths }}

  foundation-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Foundation contracts and functional tests
        run: python scripts/checks/Test-DotnetSuites.py --suite foundation --suite prompt-registration --suite software-read --suite special-export-shape --suite device-add --suite hardware-catalog --suite diagnostic-membership --suite adapter-contracts --suite worker-channel
      - name: Build host and synthetic worker without Siemens SDKs
        shell: pwsh
        run: |
          dotnet publish src/FoundationHost/TiaMcpServer.LegacyHost.csproj -c Release -o bin-build/ci-foundation
          if ($LASTEXITCODE) { throw 'Host build failed' }
          dotnet build tests/Engine/TiaMcpServer.TransportFixture/TransportFixture.csproj -c Release
          if ($LASTEXITCODE) { throw 'Fixture build failed' }
          foreach ($key in @('14sp1','15.1','16','17','18','19')) {
            $target = "runtime/v$key"
            New-Item -ItemType Directory -Force $target | Out-Null
            Get-ChildItem bin-build/ci-foundation -File | Copy-Item -Destination $target
            [IO.File]::WriteAllText((Join-Path $target 'release-key.txt'), $key)
          }
      - name: Six real STDIO hosts and isolated HTTP sessions
        run: python scripts/checks/Test-FoundationTransport.py --fixture tests/Engine/TiaMcpServer.TransportFixture/bin/Release/net10.0/TransportFixture.exe --output bin-build/ci-foundation-results
