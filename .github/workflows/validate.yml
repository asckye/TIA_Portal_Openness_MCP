name: validate-bundle

# Note: a full compile-CI is NOT possible on hosted runners — the build needs
# Siemens.Engineering.dll from a licensed TIA Portal install, which GitHub
# runners don't have. This offline check validates bundle integrity instead
# (required files, JSON parse, blueprint list, tool roster, build records and
# version consistency). Source hashes are regenerated and fully verified at
# release time. Since 2.8.1 the engine runtimes and TiaOpenness.exe are not
# tracked in Git (the maintainer builds them locally and the C# release tool uploads the
# delivery ZIP), so the checks run with --no-binaries / -NoBinaries here; the
# uploaded ZIP is verified by the "Verify published release" workflow.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release tool uses local version tags to recognize frozen, published notes.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: decoder-python
        with:
          python-version: '3.12.10'
          architecture: 'x64'
      - name: Export the pinned decoder interpreter
        run: '"TIA_MCP_DECODER_PYTHON=${{ steps.decoder-python.outputs.python-path }}" >> $env:GITHUB_ENV'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Documentation links and repository entrypoints
        run: dotnet run --project build-tools/release -- check-repository -NoBinaries
      - name: Generation model, basic package and golden plan tests
        run: dotnet run --project build-tools/release -- test-suites -ResultsDirectory bin-build/ci-covered-results -Suite generation-model -Suite generation-planning
      - name: Release prerequisites, reuse and documentation assertions
        run: |
          # Stop at the first failing command; otherwise only the last exit code fails the step.
          $PSNativeCommandUseErrorActionPreference = $true
          # The host runs the full registered suite against all eight licensed SDKs.
          dotnet run --project build-tools/release -- test-suites -ResultsDirectory bin-build/ci-covered-results -Suite release-tool `
            -DotnetArg=--filter '-DotnetArg=Category!=RequiresSiemensSdk'
      - name: Release safety suites and production PLC name fixture
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 scripts/checks/Test-NativeLifecycle.py --self-test
          python -X utf8 scripts/checks/Test-NativeMcpSession.py --self-test
          dotnet run --project build-tools/release -- test-suites -ResultsDirectory bin-build/ci-covered-results -Suite crash-evidence
          dotnet run --project build-tools/release -- test-suites -ResultsDirectory bin-build/ci-covered-results -Suite write-guard
          dotnet run scripts/checks/Test-MatchPlcName.cs -- -SourceOnly
      - name: Release feature defines match the reviewed table
        run: dotnet run --project build-tools/release -- check-tia-features
      - name: Supplementary read and worker dispatch source contracts
        run: dotnet run --project build-tools/release -- test-suites -ResultsDirectory bin-build/ci-covered-results -Suite source-contracts
      - name: Build launcher and test .NET 10 configuration page
        run: dotnet run --project tests/Studio/TiaOpenness.Configuration.Tests/TiaOpenness.Configuration.Tests.csproj -c Release -- bin-build/configuration-tests
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: validate-bundle-test-results
          path: |
            bin-build/ci-test-results/
            bin-build/ci-covered-results/
            bin-build/test-results*/
