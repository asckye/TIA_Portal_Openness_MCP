name: validate-bundle

# Note: a full compile-CI is NOT possible on hosted runners — the build needs
# Siemens.Engineering.dll from a licensed TIA Portal install, which GitHub
# runners don't have. This offline check validates bundle integrity instead
# (required files, JSON parse, blueprint list, tool roster, build records and
# version consistency). Source hashes are regenerated and fully verified at
# release time. Since 2.8.1 the engine runtimes and TiaOpenness.exe are not
# tracked in Git (the maintainer builds them locally and Release.ps1 uploads the
# delivery ZIP), so the checks run with --no-binaries / -NoBinaries here; the
# uploaded ZIP is verified by the "Verify published release" workflow.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Documentation links and repository entrypoints
        run: python scripts/checks/Check-Repository.py --no-binaries
      - name: Offline bundle validation
        shell: pwsh
        run: ./scripts/checks/Validate-Bundle.ps1 -Strict -NoBinaries -SkipSourceHashes
      - name: Windows PowerShell bundle validation and CHANGELOG self-tests
        shell: powershell
        run: |
          & ./scripts/checks/Validate-Bundle.ps1 -SelfTest
          if ($LASTEXITCODE) { throw 'CHANGELOG self-tests failed' }
          & ./scripts/checks/Validate-Bundle.ps1 -Strict -NoBinaries -SkipSourceHashes
          if ($LASTEXITCODE) { throw 'Windows PowerShell bundle validation failed' }
      - name: Release prerequisites, reuse and documentation assertions
        shell: pwsh
        run: |
          ./scripts/build/Test-ReleasePrerequisites.ps1 -SelfTest
          ./scripts/build/Release.ps1 -SelfTest
          ./scripts/build/Build-Release.ps1 -SelfTest
          ./scripts/build/Release.ps1 -DocumentationOnly
          ./scripts/checks/Validate-Bundle.ps1 -SelfTest
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Release safety suites and production PLC name fixture
        shell: powershell
        run: |
          python scripts/checks/Test-NativeLifecycle.py --self-test
          if ($LASTEXITCODE) { throw 'Native supervisor self-tests failed' }
          python scripts/checks/Test-NativeMcpSession.py --self-test
          if ($LASTEXITCODE) { throw 'Native MCP self-tests failed' }
          python scripts/checks/Test-DotnetSuites.py --suite crash-evidence
          if ($LASTEXITCODE) { throw 'Crash evidence suite failed' }
          python scripts/checks/Test-DotnetSuites.py --suite write-guard
          if ($LASTEXITCODE) { throw 'Write guard suite failed' }
          dotnet run scripts/checks/Test-MatchPlcName.cs -- -SourceOnly
          if ($LASTEXITCODE) { throw 'PLC name fixture failed' }
      - name: Script calls must use registered V4 tools
        shell: pwsh
        run: |
          python scripts/checks/Check-ScriptToolCalls.py --self-test
          if ($LASTEXITCODE) { throw 'Script tool checker self-tests failed' }
          python scripts/checks/Check-ScriptToolCalls.py
          if ($LASTEXITCODE) { throw 'Unregistered script tool calls' }
          python scripts/mcp_results.py
          if ($LASTEXITCODE) { throw 'V4 result decoder tests failed' }
          python scripts/checks/Test-ScriptClients.py
          if ($LASTEXITCODE) { throw 'Script client tests failed' }
      - name: Release feature defines match the reviewed table
        run: python scripts/checks/Check-TiaFeatures.py
      - name: Supplementary read and worker dispatch source contracts
        run: python scripts/checks/Test-SupplementaryReadSources.py
      - name: Build launcher and test .NET 10 configuration page
        shell: powershell
        run: ./scripts/build/Build-Configurator.ps1 -Test
