name: Verify published release
run-name: Verify ${{ github.event.release.tag_name || inputs.tag }}

# Preparation verifies the package before it is uploaded to a private draft.
# Publication verifies the actual assets without depending on tracked delivery records.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: windows-latest
    env:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the ZIP and its .sha256 from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$tag" --repo "${{ github.repository }}" --dir assets --pattern '*.zip' --pattern '*.sha256'
      - name: Verify the published ZIP against its SHA-256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          assets = pathlib.Path('assets')
          zips = list(assets.glob('*.zip'))
          sidecars = list(assets.glob('*.sha256'))
          if len(zips) != 1 or len(sidecars) != 1 or sidecars[0] != zips[0].with_suffix('.sha256'):
              raise SystemExit('Release must have one ZIP and its matching .sha256')
          archive, sidecar = zips[0], sidecars[0]
          match = re.fullmatch(r'([0-9a-fA-F]{64})  (.+)', sidecar.read_text(encoding='utf-8').strip())
          if match is None or match[2] != archive.name:
              raise SystemExit('Invalid SHA-256 sidecar or mismatched ZIP name')
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != match[1].lower():
              raise SystemExit('Published ZIP SHA-256 differs from sidecar')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## {os.environ["tag"]} verified\n\n{archive.name} — SHA-256 `{digest}` matches its published sidecar.\n')
          PY
