name: Publish complete release

on:
  # Pushing a version tag on master publishes the same way as a manual dispatch;
  # the tag must equal "v" + manifest/delivery.json release and point at master HEAD.
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      archive_legacy:
        description: 'Move historical releases with fork/feature suffixes to drafts'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: complete-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pushed tag must match the delivery version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $delivery = Get-Content manifest/delivery.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($delivery.release)") { throw "Tag $env:GITHUB_REF_NAME does not match manifest/delivery.json release $($delivery.release)" }
      - name: Validate and package complete V20/V21 delivery
        shell: pwsh
        run: python scripts/build/Package-Release.py
      - name: Publish verified assets and optionally archive legacy releases
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/build/Publish-Release.cjs');
            await publish({github, context, core});
