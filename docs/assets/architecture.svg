<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
  <title id="title">TIA Portal Openness MCP 4.0 components</title>
  <desc id="desc">AI clients and the Workbench Engineering page share a FoundationHost session. Each session owns a version-matched worker: PLC worker on V14 SP1 through V19, engine worker on V20 and V21. The worker alone calls TIA Openness.</desc>
  <!-- Editable vector source. Relationships match docs/development/design-spec/architecture.md. -->
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d} .heading{font-size:19px;font-weight:600} .body{font-size:15px} .box{fill:#f6f8fa;stroke:#8799b0;stroke-width:1.5} .arrow{stroke:#405778;stroke-width:2;fill:none}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405778"/></marker>
  </defs>
  <rect width="1100" height="450" fill="white"/>
  <text x="30" y="37" class="heading">TIA Portal Openness MCP 4.0</text>
  <text x="30" y="65" class="body">Eight exact releases · One worker per MCP session · Native acceptance recorded separately</text>
  <rect x="25" y="112" width="230" height="90" rx="8" class="box"/>
  <text x="42" y="145" class="heading">AI MCP client</text><text x="42" y="177" class="body">STDIO or HTTP</text>
  <rect x="25" y="270" width="230" height="135" rx="8" class="box"/>
  <text x="42" y="302" class="heading">Workbench</text><text x="42" y="331" class="body">Engineering: operator pipe</text><text x="42" y="359" class="body">Write approvals and audit</text><text x="42" y="386" class="body">UI control: separate pipe</text>
  <rect x="305" y="112" width="230" height="293" rx="8" class="box"/>
  <text x="323" y="148" class="heading">FoundationHost</text><text x="323" y="179" class="body">MCP session and catalog</text><text x="323" y="216" class="body">Precheck → approval</text><text x="323" y="245" class="body">Recheck → dispatch</text><text x="323" y="282" class="body">Shared human / AI session</text><text x="323" y="311" class="body">Lease, journal and audit</text><text x="323" y="365" class="body">.NET 10</text>
  <rect x="585" y="112" width="230" height="293" rx="8" class="box"/>
  <text x="603" y="148" class="heading">Openness worker</text><text x="603" y="184" class="body">V14 SP1–V19: PLC worker</text><text x="603" y="211" class="body">STA owner thread</text><text x="603" y="259" class="body">V20/V21: engine worker</text><text x="603" y="286" class="body">MTA owner thread</text><text x="603" y="333" class="body">Version-specific adapters</text><text x="603" y="365" class="body">.NET Framework 4.8</text>
  <rect x="865" y="112" width="210" height="293" rx="8" class="box"/>
  <text x="884" y="148" class="heading">TIA Portal</text><text x="884" y="191" class="body">Matching release / API</text><text x="884" y="230" class="body">Selected process</text><text x="884" y="259" class="body">Explicit project binding</text><text x="884" y="333" class="body">Project and engineering</text><text x="884" y="362" class="body">objects</text>
  <path d="M255 156H305" class="arrow" marker-end="url(#arrow)"/>
  <path d="M255 333H305" class="arrow" marker-end="url(#arrow)"/>
  <path d="M535 247H585" class="arrow" marker-end="url(#arrow)"/>
  <path d="M815 247H865" class="arrow" marker-end="url(#arrow)"/>
  <text x="30" y="436" class="body">A dispatched write with an unknown result must be inspected before recovery. No automatic replay.</text>
</svg>
